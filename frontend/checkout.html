<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Nightwave</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span class="logo-mark"></span>
                <span class="logo-text">
                    <h1>Nightwave</h1>
                    <span>Digital Club Store</span>
                </span>
            </a>

            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu">
                <span></span><span></span><span></span>
            </button>

            <nav class="site-nav" id="siteNav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="merchandise.html">Merchandise</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="login.html">Admin</a></li>
                </ul>
                <a href="cart.html" class="cart-link">
                    Cart <span class="cart-badge" id="cartCount">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div class="container">
                <h1>Checkout</h1>
                <p>Just need a few details to complete your order. No delivery charges - everything ships digitally.</p>
            </div>
        </div>

        <section class="section">
            <div class="container" id="checkoutContent">
                <div class="checkout-layout">
                    <div class="checkout-form-card">
                        <h2>Delivery Details</h2>
                        <form id="checkoutForm" novalidate>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" placeholder="you@email.com">
                                <span class="field-error" id="emailError"></span>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" name="phone" placeholder="04XX XXX XXX">
                                <span class="field-error" id="phoneError"></span>
                            </div>
                            <div class="form-group">
                                <label for="suburb">Suburb</label>
                                <input type="text" id="suburb" name="suburb" placeholder="e.g. Chippendale">
                                <span class="field-error" id="suburbError"></span>
                            </div>
                            <button type="submit" class="btn btn-primary btn-full">Complete Purchase</button>
                        </form>
                    </div>

                    <div class="order-summary-card">
                        <h2>Order Summary</h2>
                        <div id="orderSummaryItems">
                            <!-- summary rows inserted here by checkout.js -->
                        </div>
                        <div class="summary-total">
                            <span>Total</span>
                            <span id="orderSummaryTotal">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="footerYear"></span> Nightwave Club. Built for CST150 Web Technologies.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
